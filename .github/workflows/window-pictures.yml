name: Window pictures

# Takes the pictures of the window with the picture mode of the program (`--shot`) on a virtual screen and keeps them as an artifact of the run, so the
# pictures of the README can be renewed without building the window on a personal machine. Run it by hand: Actions > Window pictures > Run workflow; then put the pictures of the
# artifact in images/screens/ and in a pull request.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: window-pictures
  cancel-in-progress: false

env:
  # The tags of the sibling repositories the window is built against.
  COMMON_REF: "v0.3.6"

jobs:
  pictures:
    name: Take the pictures of the window
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: EH3D-PHOENIX-PNP
      - name: The sibling repositories the window is built against
        shell: bash
        run: |
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch "${COMMON_REF}" "https://github.com/${GITHUB_REPOSITORY_OWNER}/EH3D-COMMON.git" EH3D-COMMON
      - name: Libraries of the window and a virtual screen
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgl1-mesa-dri xvfb fonts-noto-cjk
      - name: Rust toolchain
        shell: bash
        working-directory: EH3D-PHOENIX-PNP
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
      - name: Build the window
        working-directory: EH3D-PHOENIX-PNP
        run: cargo build --release --features gui
      - name: Take the pictures
        # the examples are named from the folder of the repository, so that no path of the machine appears in a picture;
        # the run has a home folder of its own
        working-directory: EH3D-PHOENIX-PNP
        shell: bash
        run: |
          set -euo pipefail
          exe="$GITHUB_WORKSPACE/EH3D-PHOENIX-PNP/target/release/phoenix-pnp"
          out="$GITHUB_WORKSPACE/window-pictures"
          export HOME=/tmp/pictures/home XDG_CONFIG_HOME=/tmp/pictures/config
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$out"
          shot() { xvfb-run -a -s "-screen 0 1920x1080x24" timeout 120 "$exe" gui "$@" --theme phoenix --size 1640x940 --wait 20 examples/board.pos examples/feeders.csv examples/machine.cfg; }
          for lang in en es de fr it ja zh pt; do
            shot --shot "$out/job_$lang.png" --window job --steps 9 --lang "$lang"
            shot --shot "$out/machine_$lang.png" --window machine --lang "$lang"
          done
          # the narrow sizes at which the side columns are checked
          for lang in en de; do
            for width in 1400 1520; do
              shot_at() { xvfb-run -a -s "-screen 0 1920x1080x24" timeout 120 "$exe" gui "$@" --theme phoenix --size "${width}x900" --wait 20 examples/board.pos examples/feeders.csv examples/machine.cfg; }
              shot_at --shot "$out/narrow_${width}_job_$lang.png" --window job --steps 9 --lang "$lang"
              shot_at --shot "$out/narrow_${width}_feeders_$lang.png" --window feeders --lang "$lang"
            done
          done
          ls -l "$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: window-pictures
          path: window-pictures/*.png
          if-no-files-found: error
          retention-days: 14

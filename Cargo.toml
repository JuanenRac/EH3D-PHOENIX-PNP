[package]
name = "eh3d-pnp-manager"
version = "0.0.3"
edition = "2021"
rust-version = "1.75"
description = "Pick and place assembly: the position files of the CAD programs, the feeders of the machine and the order in which the parts are placed"
license = "GPL-3.0-or-later"
repository = "https://github.com/JuanenRac/EH3D-PNP-MANAGER"
readme = "README.md"

[lib]
name = "eh3d_pnp_manager"
path = "src/lib.rs"

[[bin]]
name = "eh3d-pnp"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true

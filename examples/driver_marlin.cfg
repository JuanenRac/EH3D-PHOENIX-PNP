# Profile of a G-code driver for a Marlin controller on a serial line. One `key = value` line each; `#` starts a comment line. Read it with `phoenix-pnp driver-check`.
# The profile has been tried only against the simulated controller of this program (evidence=simulator): no port is opened and no machine has been moved with it.
schema_version = 1
dialect = marlin
transport = serial
baud = 115200

# The letters of the axes. The axis that turns the nozzle is the one the firmware calls E on many pick and place machines; `none` when there is no such axis.
axis_x = X
axis_y = Y
axis_z = Z
axis_rot = E

# The lines that open the session (a list: every line is sent in order), the mode of the coordinates, and the lines that end it, home it and leave it safe when something fails.
connect = M115
absolute_mode = G90
home = G28
disable = M84
safe_stop = M42 P5 S0
safe_stop = M42 P6 S0
safe_stop = M84

# The line that waits for the moves to end, the one that asks for the position and the template of the dwell ({ms} is the time).
wait = M400
position_request = M114
move_command = G1
dwell = G4 P{ms}

# The pins and fans that switch: name | line that switches it on | line that switches it off. The pump holds the part on the nozzle and the release blows it off.
actuator = pump | M42 P5 S255 | M42 P5 S0
actuator = blow | M42 P6 S255 | M42 P6 S0
pump = pump
release = blow
pump_settle_ms = 150
release_settle_ms = 80

# How a line from the controller reads. The first line that matches decides: an error, then busy, then ok, then a position, then an echo.
ok_pattern = ^ok
error_pattern = (?i)^(error|!!)
busy_pattern = (?i)^(echo:)?busy
ignore_pattern = ^echo:
# Groups: 1 X, 2 Y, 3 Z and, when it is there, 4 the turn (the E that Marlin writes for the extruder).
position_pattern = X:(-?\d+\.?\d*) Y:(-?\d+\.?\d*) Z:(-?\d+\.?\d*)(?: E:(-?\d+\.?\d*))?
tolerate_unknown_echo = yes

# Feeds (mm/min) and heights (mm). A move over feed_max_mm_min or outside the limits (the feeders of the examples sit at X -20) is refused, never cut down.
feed_travel_mm_min = 12000
feed_z_mm_min = 3000
feed_max_mm_min = 20000
z_travel_mm = 10
z_pick_mm = 0.5
z_place_mm = 1
limit_x_min_mm = -50
limit_y_min_mm = -50
limit_x_mm = 400
limit_y_mm = 300
limit_z_min_mm = 0
limit_z_max_mm = 40
nozzles = 1

# Times (seconds), tries and how near the head must be to its target (mm).
command_timeout_s = 5
move_timeout_s = 30
connect_timeout_s = 10
retries = 2
retry_wait_s = 0.25
position_tol_mm = 0.05

# The rules that only slow the machine down after a trouble (a retry, a timeout, a refused move): how many troubles bring careful, slow and held, and the share of the feed each allows.
safety_careful_events = 1
safety_slow_events = 3
safety_hold_events = 5
safety_careful_speed_pct = 60
safety_slow_speed_pct = 25

# homing-repeat: the spread (mm) the places after the homing may have; bringup: the side (mm) of the square the head moves round.
homing_spread_mm = 0.05
bringup_probe_mm = 20

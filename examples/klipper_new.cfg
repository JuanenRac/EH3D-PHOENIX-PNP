# the same machine after the settings were tuned
[stepper_x]
step_pin: PF13
dir_pin: PF12
rotation_distance: 40.0
microsteps: 32
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 0
position_max: 450
homing_speed: 60

[stepper_y]
step_pin: PG0
dir_pin: PG1
rotation_distance: 40
microsteps: 16
endstop_pin: ^PG6
position_max: 300

[tmc2209 stepper_x]
uart_pin: PC4
run_current: 0.8
diag_pin: ^PG6
driver_SGTHRS: 110

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 5000

[gcode_macro NOZZLE_UP]
gcode:
    M42 P5 S0
    G4 P300

[gcode_macro NOZZLE_DOWN]
gcode:
    M42 P5 S1


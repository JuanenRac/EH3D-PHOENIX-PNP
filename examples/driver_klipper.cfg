# Profile of a G-code driver for a Klipper controller reached through Moonraker (HTTP). The same keys as driver_marlin.cfg; what differs is the dialect, the transport and the paths.
# The profile has been tried only against the simulated Moonraker of this program (evidence=simulator): no connection is made and no machine has been moved with it.
schema_version = 1
dialect = klipper
transport = moonraker

axis_x = X
axis_y = Y
axis_z = Z
axis_rot = E

# Klipper has no M115 that the host needs; a harmless line opens the session.
connect = M115
absolute_mode = G90
home = G28
disable = M84
safe_stop = SET_PIN PIN=pump VALUE=0
safe_stop = SET_PIN PIN=blow VALUE=0
safe_stop = M84

wait = M400
position_request = M114
move_command = G1
dwell = G4 P{ms}

# Klipper switches pins by name (an [output_pin] of its configuration): SET_PIN PIN=name VALUE=0..1.
actuator = pump | SET_PIN PIN=pump VALUE=1 | SET_PIN PIN=pump VALUE=0
actuator = blow | SET_PIN PIN=blow VALUE=1 | SET_PIN PIN=blow VALUE=0
pump = pump
release = blow
pump_settle_ms = 150
release_settle_ms = 80

# Rules that keep an axis from moving while something is not as it should be: signal | the state it must be in | the axes it guards (xy, z, rot or all). A signal is the name of an actuator above (what it was last
# switched to) or of a sensor that the program reports (a door, the nozzles lifted); a signal nobody has reported is unknown and does not satisfy a rule, so the move is refused and the machine is left safe.
# Here the carriage does not move in X and Y while the blow valve is on.
interlock = blow | off | xy

# Moonraker answers a script with a status and a JSON body; the link of this program turns the answers into the lines the patterns below read: `ok`, `!! message` and a line `X:.. Y:.. Z:.. E:..`.
ok_pattern = ^ok
error_pattern = ^(!!|error)
busy_pattern = (?i)^busy
ignore_pattern = ^(//|echo:)
position_pattern = X:(-?\d+\.?\d*) Y:(-?\d+\.?\d*) Z:(-?\d+\.?\d*)(?: E:(-?\d+\.?\d*))?
moonraker_script_path = /printer/gcode/script
moonraker_query_path = /printer/objects/query?toolhead
tolerate_unknown_echo = yes

feed_travel_mm_min = 12000
feed_z_mm_min = 3000
feed_max_mm_min = 20000
z_travel_mm = 10
z_pick_mm = 0.5
z_place_mm = 1
limit_x_min_mm = -50
limit_y_min_mm = -50
limit_x_mm = 400
limit_y_mm = 300
limit_z_min_mm = 0
limit_z_max_mm = 40
nozzles = 1

command_timeout_s = 5
move_timeout_s = 30
connect_timeout_s = 10
retries = 2
retry_wait_s = 0.25
position_tol_mm = 0.05

safety_careful_events = 1
safety_slow_events = 3
safety_hold_events = 5
safety_careful_speed_pct = 60
safety_slow_speed_pct = 25

homing_spread_mm = 0.05

# Homing without end switches, as in driver_marlin.cfg: with `sensorless` give a sensitivity for X and one for Y; the line sets the field of the driver of the motor of each axis.
homing_mode = switch
# homing_sensitivity_x = 80
# homing_sensitivity_y = 75
homing_sensitivity_line = SET_TMC_FIELD STEPPER=stepper_{axis_lower} FIELD=sgthrs VALUE={value}
bringup_probe_mm = 20

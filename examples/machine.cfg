# EH3D-PHOENIX-PNP machine and planner settings. Every line is optional; a missing line keeps the default shown here.
# The format is key = value, one per line, as in the other programs of the suite. A line that starts with # is a comment.

# The version of this file format. A file with a higher number than the program knows is refused.
schema_version = 1
# The language of the error messages: en, es, de, fr, it, ja, zh or pt.
language = en
# The largest file (bytes) and the most parts the program will read.
max_file_bytes = 16777216
max_parts = 50000

# How many parts the head carries at once, from 1 to 6.
nozzles = 2

# Motion of the head. speed_mm_s sets the speed of both axes; the x_ and y_ keys set one axis.
# Acceleration in mm/s2; jerk in mm/s3 (0 = a trapezoid profile without jerk). X and Y move at the same time, so a move takes as long as the slower axis.
speed_mm_s = 150
x_speed_mm_s = 150
y_speed_mm_s = 150
x_accel_mm_s2 = 2000
y_accel_mm_s2 = 2000
x_jerk_mm_s3 = 0
y_jerk_mm_s3 = 0

# Times of the actions, in seconds.
pick_s = 0.4
place_s = 0.4
feed_s = 0.2
tip_change_s = 3

# The nozzle turns this fast (degrees per second) and may turn only within this range of absolute angles.
rotation_deg_s = 720
nozzle_angle_min_deg = -360
nozzle_angle_max_deg = 360
# Turn the nozzle while the head travels (yes) or only when it arrives (no).
pre_rotate = yes

# Heights (Z) and limits. safe_z_mm must be inside the travel of Z and not below the top of the board; the limits of X and Y are checked before a job runs.
safe_z_mm = 5
board_top_z_mm = 0
z_min_mm = -10
z_max_mm = 50
limit_x_min_mm = -2000
limit_x_max_mm = 2000
limit_y_min_mm = -2000
limit_y_max_mm = 2000

# Retries: how many more times to try a feed, a pick or a place that failed. max_placement_attempts is the ceiling on the attempts to place one part.
feed_retries = 1
pick_retries = 2
place_retries = 1
max_placement_attempts = 3
# alert = stop the job at once; defer = put the part aside and go on.
error_policy = alert
# A feeder is switched off when fault_limit of its last fault_window picks failed (fault_limit = 0 never switches it off).
fault_window = 6
fault_limit = 3
# What happens then: disable = the feeder is switched off and another one of the same kind takes over; alert = the job stops with PHOENIX-PNP-047 and the person chooses (try again, leave the part out, put it aside or switch the feeder off).
fault_action = disable

# The order of the places: nearest, part, height_part, pick, tips or none.
order = nearest
# A list of keys that orders the places in place of order: unit, feeder, part, height, area and quantity, each with :asc or :desc (for example unit, height:asc, quantity:desc). Empty: order decides.
placement_order =
# minimize = bring the parts of the same nozzle tip together; as_planned = follow the planned order; optimize = bring them together and search for the order of the tips with the
# shortest way and time (the trip to the tip changer included, and the tip already on the nozzle when a block of ranks starts).
tip_strategy = minimize
# Shorten the walk with 2-opt moves (never makes it longer), for walks of up to two_opt_max_points places, with at most two_opt_passes passes.
two_opt = yes
two_opt_max_points = 2000
two_opt_passes = 10
# Ranks are grouped in blocks of rank_step (0 to 9, 10 to 19, ...). All the parts of a lower block are placed before any part of a higher block; inside a block a lower rank is only a preference.
rank_step = 10
# cad_origin = the point of a part is the origin of its footprint; pads_center = apply the origin correction of the table of parts.
component_origin = cad_origin

# Defaults for the properties of a part that neither the table of parts nor the table of packages sets.
default_height_mm = 1
default_through_board_mm = 0
default_bin = 0
default_tip =
default_rank = 0
# The width of the tape, in millimetres, of a part that no table gives it for.
default_tape_mm = 8

# The place of the nozzle tip changer (both or neither).
tip_changer_x_mm = -50
tip_changer_y_mm = 0

# Correction of the rotation by package: PATTERN : DEGREES, added to the angle of the parts. The first rule that matches wins; * stands for any text and ? for one character.
rotation = QFN-* : 90
rotation = SOT-23* : 180

# More names for the columns of a CSV position file, separated by commas (they are added to the usual ones).
header_reference = designator
header_value = comment
header_package = footprint
header_x = center-x
header_y = center-y
header_rotation = rotation
header_side = layer
# More names for the column that says a part is not to be mounted (a yes in it leaves the part out of the plan; the usual ones are dnp, do not place, do not populate, do not mount,
# do_not_place, not fitted and no montar) and for the column that says a part is to be mounted (a no leaves it out; fitted, populate, populated, mount, mounted and montar). An empty cell mounts the part.
header_dnp = exclude
header_fitted = assemble
# More words that mean yes and no in those columns (yes, y, true, 1 and x mean yes; no, n, false, 0 and - mean no). Any other word is an error that names the row.
dnp_yes_words = si, ja
dnp_no_words = nao, nein
# Which pair of position columns to read when a file has both the centre and the origin of the part: any, center or origin.
position = any
# What to do with the angle of the parts of the bottom side in a CSV: keep, mirror (360 minus the angle) or half_turn (plus 180).
bottom_rotation = keep

# The simulator: a seed, so that the same settings always fail in the same places, and the chance (0 to 1) that a feed, a pick or a place fails.
sim_seed = 1
sim_feed_fail_rate = 0
sim_pick_fail_rate = 0
sim_place_fail_rate = 0
# Chances of failure by kind of part and by feeder, on top of the general ones (written more than once, one line for each): the package (with * and ?) and the chance that a pick and a
# place of it fail, and the id of a feeder and the chance that a pick from it fails. The first rule for a package is the one used. They are listed in the statistics of a simulation.
sim_part_fail = QFN-* : 0 : 0
sim_feeder_fail = F3 : 0

# The window (the program started without a command): how many steps of the simulated job it makes in a second (0.1 to 1000), the colours (phoenix, light or contrast)
# and the side, in millimetres, of the square drawn for a part whose package it does not know (0.2 to 50).
gui_steps_per_s = 4
gui_theme = phoenix
gui_part_size_mm = 2

# Fiducials of a panel (the command line option --fiducials, and the Panels tab of the window): the measured places of the marks are fitted to the designed ones. auto = a similarity
# (a turn, one scale, a shift) with two marks and an affine fit with three or more; similarity or affine force one. A mark further than fiducial_max_residual_mm (millimetres)
# from where the fit puts it makes the fit refused.
fiducial_mode = auto
fiducial_max_residual_mm = 0.5

# Parts that are marks and not parts to mount: a part whose value or package holds one of the words of fiducial_words (a list separated by commas, any case) or whose reference is
# one of the prefixes of fiducial_refs followed by a number (FID1, FD2) is not placed: it becomes a mark of its board, named board/reference (A/FID1), that a measured mark can name
# in the file of --fiducials. An empty list turns that rule off.
fiducial_words = fiducial
fiducial_refs = fid, fd

# The order in which the cells of a tray are emptied when its row of the feeders file has no fill column: rows, columns or snake (along a row and back along the next).
tray_fill = rows

# The window: how many edits of the tables of feeders and packages (and fixes of the problems) can be taken back, from 1 to 1000.
undo_limit = 100

# The search of tip_strategy = optimize stops after tip_opt_max_evals orders of the tips have been tried or after tip_opt_time_limit_s seconds of the clock, whichever comes first.
# Only the number of orders tried gives the same plan on every computer; up to eight different tips are tried in every order, more are ordered by the nearest first.
tip_opt_max_evals = 20000
tip_opt_time_limit_s = 1

# The align step: after a part is picked the camera looks at it and the place is corrected by what it sees (off = the job is exactly the one without the step; on = look and correct).
align = off
# A part that the camera finds further than this (millimetres, 0.001 to 50) from the nozzle is thrown away and picked again, as error_policy says.
pick_tolerance_mm = 0.5
# How many times the camera looks and the correction is made again (1 to 5), and the seconds (0 to 10) to wait before every look for the part to settle on the nozzle. Both add to the time of the plan.
align_passes = 1
align_settle_s = 0.1
# The simulated camera: the chance (0 to 1) that a look gives no reading, how far (millimetres) and how much turned (degrees) it finds every part, and a random error of each reading
# (from minus to plus this many millimetres, drawn from sim_seed).
sim_camera_fail_rate = 0
sim_align_dx_mm = 0
sim_align_dy_mm = 0
sim_align_deg = 0
sim_align_noise_mm = 0
# Where the simulated camera takes its readings from: off = the offset above; pipeline = it draws a picture of the part (an image made in memory) and the vision pipeline measures it
# (the steps of the pipeline are in vision.cfg, given with --vision FILE). Only the align step looks at the camera.
vision = off

# The vacuum (off = the job is exactly the one without it; on = after a pick the vacuum must show the part on the nozzle, after a place it must show it gone). The seconds (0 to 10) the pump sucks before
# the first reading and the seconds of blowing before the second one add to the time of the plan.
vacuum = off
vacuum_suck_s = 0.08
vacuum_blow_s = 0.05
# The levels, in kilopascals below the air (0 to 101), must satisfy free <= release_max < pick_min <= held. The simulated nozzle reads free_kpa when it holds nothing and held_kpa when it holds a part;
# a reading at or above pick_min_kpa after a pick means the part is held, a reading at or below release_max_kpa after a place means the part is gone.
vacuum_free_kpa = 8
vacuum_held_kpa = 62
vacuum_pick_min_kpa = 40
vacuum_release_max_kpa = 20
# The simulated sensor: a random error of each reading (from minus to plus this many kilopascals, drawn from sim_seed) and the chances (0 to 1) that a pick leaves no part on the nozzle (PHOENIX-PNP-044)
# and that a place leaves the part stuck to it (PHOENIX-PNP-045).
sim_vacuum_noise_kpa = 0
sim_vacuum_miss_rate = 0
sim_vacuum_stuck_rate = 0
# The on/off devices of the machine (a valve, a light, a pump), one line each: a name of letters, digits, _ and - and the seconds (0 to 10) the device takes to answer. The simulated job switches them with
# Job::set_actuator, which adds that time to the clock of the machine.
actuator = light : 0.02

# The camera that looks at the part on the nozzle (the align step and the simulated vision): camera_units_per_px is the size of a pixel on the part in millimetres that the software believes (0 =
# the size the vision pipeline is set to, mm_per_px of vision.cfg); camera_offset_x_mm and camera_offset_y_mm say where the axis of the nozzle is in the picture, in millimetres from its
# middle, in the frame of the machine; camera_rotation_deg turns the picture counter-clockwise with respect to the axes of the machine; camera_flip_x and camera_flip_y mirror it. The lens can
# differ from what the software believes: camera_lens_scale (0.5 to 2) is the true size of a pixel over the believed one and camera_lens_k1 (-0.01 to 0.01 per square millimetre) bends the
# picture. With these values the picture is in the frame of the machine, centred on the nozzle, with a perfect lens, and a job is exactly the one without the model.
camera_units_per_px = 0
camera_offset_x_mm = 0
camera_offset_y_mm = 0
camera_rotation_deg = 0
camera_flip_x = off
camera_flip_y = off
camera_lens_scale = 1
camera_lens_k1 = 0

# The calibration of the camera from a pattern (camera-pattern): the points of the pattern are camera_pattern_pitch_mm apart (0.01 to 100) and a point farther than
# camera_pattern_max_residual_mm (0.0001 to 5) from the model of the fit makes the calibration be refused.
camera_pattern_pitch_mm = 1
camera_pattern_max_residual_mm = 0.05

# With camera_correct_lens on the camera takes the bending of the lens (camera_lens_k1, as camera-pattern finds it) out of what it sees, so the readings of the align step are those of a
# lens that bends nothing; off leaves the bending in the readings. camera_units_per_px should then be the true size of a pixel, as camera-pattern gives it.
camera_correct_lens = off

# The queue of jobs (queue-run): with queue_confirm on a job runs only when the person confirmed its plan with queue-confirm, and the confirmation is void when the files or the settings change
# the plan; off lifts the gate, for the simulated machine only. With queue_stop_on_failure on the queue stops at the first job that fails; off goes on to the next ones.
queue_confirm = on
queue_stop_on_failure = on

# The heads of the machine, one line each (up to 4): NAME : NOZZLES [: OFFSET_X : OFFSET_Y : CAMERA_X : CAMERA_Y : CAMERA_ROT : CAMERA_UNITS : CAMERA_LENS]. A head puts its first nozzle over a place
# when the carriage is at that place less its offset (millimetres), so what a head reaches depends on the limits of the machine; a camera field that is left out or empty is the one of the camera above.
# With two or more heads the plan of schedule also gives each head its parts and the clock of the machine counts the waits of a head for a feeder that another head is using. The line below is the
# one head that a machine has when it declares none (the nozzles key above says how many nozzles it carries).
head = main : 2

# The nozzle tips that a package accepts: PATTERN : TIP, TIP, ... (one line each, up to 64 rules; * and ? in the pattern, any case; the preferred tip first). A part whose row of the tables names a tip keeps it.
# tip_compat_mode = fewest_changes gives each kind of part one tip of its list so that the machine needs as few different tips as it can (the preferred ones among equal choices); preferred takes
# the first tip of every list. The rule below matches no package of the example.
tip_compat = SOT-23* : tip-small, tip-large
tip_compat_mode = fewest_changes

# The recipe of a job (a file given with --recipe FILE, see examples/job.recipe) is read within these limits: the most bytes the file may have (256 to 1048576) and the most rules of package, feeder
# and tip it may hold (1 to 1000).
recipe_max_bytes = 65536
recipe_max_rules = 64

# The import of a position file (import-centroid, see examples/centroid.csv, examples/centroid.map and examples/board.mnt): import_unit is the unit (mm, mil or inch) of the numbers of a file that
# gives none, and import_bottom_mirror_width_mm (0 to 10000) is the width of the board for files that give the bottom side as it is seen from below: the X of a part of the bottom side becomes
# this width minus X (0 leaves it as the file has it). The angle of the parts of the bottom side follows bottom_rotation above.
import_unit = mm
import_bottom_mirror_width_mm = 0

# The runout of the nozzle tip (nozzle-calibrate measures it from readings of the tip at several angles): nozzle_runout_mm (0 to 5) is how far the tip is from the axis the nozzle turns about
# and nozzle_runout_deg (-180 to 180) the direction of the tip from the axis when the nozzle is at 0 degrees. When the runout is above 0 the G-code of a plan (--gcode) moves each place
# by the opposite of the runout at the angle of the part, so that the tip, not the axis, lands on the place.
nozzle_runout_mm = 0
nozzle_runout_deg = 0

# The parts that have a direction (polarity-sheet lists them with their place and turn for the look after a job): a part is on the sheet when its reference matches a pattern of polarity_refs
# or its package matches one of polarity_packages (lists separated by commas, * and ? allowed, any case). An empty list turns that rule off.
polarity_refs = d*, led*, u*, ic*, q*, cp*, j*
polarity_packages = *led*, *dip*, *soic*, *sop*, *qfn*, *qfp*, *bga*, *sot*, *sod*, *dfn*, *tant*, cp_*, *elec*

# The slack of the axes (backlash): backlash_x_mm and backlash_y_mm (0 to 2 millimetres) say how much each axis gives before it takes up the load when it reverses. The simulated machine,
# with backlash_mode = off, ends a move that reverses an axis short by the slack and counts it (simulate prints it); with approach, a move in the negative direction of an axis goes past
# the place by the slack and comes back, so that every move ends in the positive direction: no error, and the time of the second leg. A move whose overshoot would leave the limits of the
# machine is not made that way. With a slack of 0 nothing changes.
backlash_x_mm = 0
backlash_y_mm = 0
backlash_mode = off

# The spare of an order (bom-order lists the parts to buy for a number of boards): each line gets order_spare_percent per cent more (0 to 100, rounded up) or order_spare_min more (0 to 1000),
# whichever is larger, for the parts that are lost in the feeders, on the floor and in failed picks. --spare-percent and --spare-min of the command win over these.
order_spare_percent = 0
order_spare_min = 0

# What the Tools tab of the window starts with (a person can change every value there). order_boards (1 to 100000) is the number of boards of the list of parts to buy. The panel form starts
# with panel_cols by panel_rows boards (1 to 100) at a pitch of panel_pitch_x_mm by panel_pitch_y_mm (0.001 to 10000 millimetres); panel_fiducial_mm (0 to 1000) is the margin of the three
# fiducials around the grid (0 puts none); panel_board_width_mm and panel_board_height_mm (0 to 10000) are the real size of a board, so that the fiducials go around the grid as it is
# (0 takes the whole pitch, the same as panelize without --board-size).
order_boards = 1
panel_cols = 2
panel_rows = 2
panel_pitch_x_mm = 50
panel_pitch_y_mm = 50
panel_fiducial_mm = 0
panel_board_width_mm = 0
panel_board_height_mm = 0
# The look at the part on the nozzle (part-inspect): the camera measures the sides of the part, where it hangs and how much it is turned, and the command compares them with the size of
# the package (a table with the columns package,long_mm,short_mm). A part whose side is more than part_size_tol_mm (0.01 to 5) off its size, whose turn is more than part_angle_tol_deg
# (0.1 to 45) off the expected one, or that hangs further than part_offset_max_mm (0.1 to 20) from the axis of the nozzle is refused.
part_size_tol_mm = 0.3
part_angle_tol_deg = 5
part_offset_max_mm = 2

# What the fit of the fiducials says about the panel and its boards. fiducial_check is off (not made), warn (the findings are printed and the job goes on) or refuse (a finding stops the
# job). The limits: the turn from the design (0.1 to 180 degrees), the scale along either axis (0.01 to 50 per cent), how far the axes are from square (0.01 to 45 degrees), how far the
# middle of the marks moved (0.1 to 1000 mm) and how much a board may be turned in the panel beyond the turn of the panel (0.1 to 180 degrees).
fiducial_check = warn
fiducial_max_rotation_deg = 5
fiducial_scale_tol_percent = 1
fiducial_shear_tol_deg = 0.5
fiducial_max_shift_mm = 5
fiducial_level_turn_deg = 2
# A fit whose worst mark is over fiducial_max_residual_mm is refused (refuse), or (drop_worst) made again without that mark when it alone explains the excess and the marks that are
# left still fix the fit more than they need (four marks for a similarity, five for an affine fit); the mark that was left out is said.
fiducial_reject = refuse

# The feeders in a job: the report of the feeders (simulate --report-feeders) marks a feeder that failed more than feeder_fail_percent (0 to 100) of its picks once it was tried
# feeder_fail_min_picks times (1 to 100000). feeder-check warns about a strip whose pitch is not a whole number of feeder_pitch_step_mm (0 to 100, 0 does not check) and about two
# feeders whose pick places are closer than feeder_min_gap_mm (0 to 1000, 0 does not check).
feeder_fail_percent = 20
feeder_fail_min_picks = 10
feeder_pitch_step_mm = 2
feeder_min_gap_mm = 3

# The life of the nozzle tips: a tip that has placed nozzle_life_warn parts (0 to 1000000000, 0 does not warn) is told to the person to look at, by nozzle-life, setup-sheet and
# simulate --nozzle-life FILE. The counts are kept in the file that the person names (keep it beside this one); only simulate --nozzle-life writes it, after a job that ran to its end.
nozzle_life_warn = 500000

# With queue_relative_paths on, queue-add keeps the files of a job that are in the folder of the queue file (or below it) as paths from that folder, so that the folder can be moved and the queue
# run from any other; off keeps absolute paths. The setting is read from the configuration of the job that is added (or give --relative); a queue that has relative paths runs the same either way.
queue_relative_paths = off

# With queue_gui_ask_run on, the Run button of the Queue tool of the window asks first and only a second press starts the run; off starts the run at the first press. The run is on the
# simulated machine either way, and a job still needs its confirmation while queue_confirm is on.
queue_gui_ask_run = on

# The combined calibration of the camera (camera-combined and the Combined camera tool of the window) uses a pattern that is fixed to the bed while the head moves, and finds the size of a
# pixel, the turn, the offset of the nozzle and the bending of the lens in one fit. It is off by default (camera-calibrate and camera-pattern, which are separate, do not depend on it); with it on,
# camera_pattern_origin_x_mm and camera_pattern_origin_y_mm are the place of the machine where the point 0,0 of the pattern lies, measured by touching it with the nozzle.
camera_combined = off

# Where the point 0,0 of the pattern lies in the machine (millimetres), for the combined calibration.
camera_pattern_origin_x_mm = 0

# See camera_pattern_origin_x_mm.
camera_pattern_origin_y_mm = 0

# With camera_combined_touch on, the combined calibration takes the place of the point 0,0 of the sheet from a row 'origin,X,Y' of the file of sightings (where the axis of the nozzle was when it
# touched that point) instead of from camera_pattern_origin_x_mm and camera_pattern_origin_y_mm; a file without that row is then refused. Off by default; camera-combined --touch does the same for one run.
camera_combined_touch = off

# When the first look of the camera finds a part further than pick_tolerance_mm from the nozzle, the part is thrown away and picked again. With align_rereads above 0 the camera looks again, up to that many times
# (0 to 5), waiting align_settle_s before each look, and a look within the tolerance is taken as the first look; the part is thrown away only when every look is over. The extra looks add to the time of the plan,
# and the report counts for each feeder the looks over the tolerance, the extra looks and the parts that a second look saved. 0 (the default) keeps the part thrown away at the first look over the tolerance.
align_rereads = 0

# Learning the offset of the placement of each package (place-learn) takes the readings of how far the parts ended from their places and keeps the mean of each package in a file of its own. It is off by
# default; nothing moves by itself, because the offsets reach a job only when place_learn_apply is on and the file is given to simulate with --place-offsets.
place_learn = off

# With place_learn_apply on, simulate --place-offsets FILE sends the head to each place less the offset learned for its package (held within place_learn_cap_mm). Off by default: the file is then refused.
place_learn_apply = off

# No learned offset is larger than this (millimetres, 0.01 to 1), either when it is learned or when it is applied.
place_learn_cap_mm = 0.3

# A reading that lies farther from the median of its package than this many spreads (1.5 to 10; the spread is 1.4826 times the median distance from the median, never below 0.02 mm) is left out. A
# package with fewer than 5 readings has none left out.
place_learn_outlier = 3.5

# A package whose readings, once the strays are out, are fewer than this (1 to 1000) is left as it was.
place_learn_min = 3

# The offset that is already learned counts for at most this many readings (1 to 100000) when new ones come in, so that a machine that drifts is followed.
place_learn_memory = 100

# Hooks are programs that are run when something happens in a job (it finished, was paused or stopped, a part was put aside, a feeder was switched off). Running a program is off by default: with hooks
# off, simulate --hooks refuses (and --hooks-dry-run only lists what would be run). A program is a file that lies in the folder of the rules file, is named with letters, digits, '.', '_' and '-'. A
# batch file (.bat, .cmd) is allowed, with a warning before the job because it runs commands of the system; a program is run with no shell of ours, with the arguments of its rule only.
hooks = off

# The seconds a hook may run before it is stopped (1 to 60).
hooks_timeout_s = 5

# The most programs that are run for one job (1 to 100); the rest are left out and told.
hooks_max_runs = 20

# The values that the commands and the panels of the Tools tab start from when an option is not given. An option of the command, or a number typed in a panel, is stronger; a panel can keep what was typed in this file.
# How near two places have to be (millimetres, 0 to 100) and two turns (degrees, 0 to 180) for parts-diff to take them as the same.
parts_diff_tol_mm = 0.01
parts_diff_rot_tol_deg = 0.5

# board-stats looks for the parts of one side whose centres are closer than this (millimetres, 0.01 to 50; 0 leaves the look off) and lists at most this many pairs (1 to 1000).
board_stats_near_mm = 0
board_stats_limit = 20

# feeder-slots makes at most this many plans while it looks for better places for the feeders (1 to 1000000).
feeder_slots_max_plans = 5000

# simulate-runs and simulate-hotspots run the job this many times (1 to 10000).
simulate_runs_count = 20

# The journal panel runs this many steps (0 to 1000000; 0 runs the job to its end).
journal_steps = 0

# Whether the commands of the server may send jobs to the EH3D server: local (the default; nothing is sent) or server.
mode = local

# The EH3D server that mode = server talks to: where it is (host:port), the token of this program on it and the id of the machine there. They are empty until given; keep the token out of files that are shared.
server_address =
server_token =
server_machine =

# The seconds a request to the server may take (0.5 to 120), the milliseconds between two readings of a job that is followed (50 to 60000) and how many times a request to the server in memory is tried (1 to 10). On the real server the retries of the link below are used; server_attempts is also the old name of server_retries (one more than the retries) and is read as that when server_retries is not written, with a note.
server_timeout_s = 5
server_poll_ms = 500
server_attempts = 3

# The link to the server is the one client of the suite: a request that failed on the network is tried again this many more times (0 to 5), and the server may be looked for on the local network (on or off; off, it asks nothing of the network).
server_retries = 2
server_mdns = off

# nozzle-zcal: how far (mm) the height of a nozzle may be from the mean of the nozzles before it is called out of line (0.001 to 1).
nozzle_z_tol_mm = 0.02

# tape-check: how far (mm) the pitch of a tape feeder may be from the pitch its package asks for (0 to 2).
tape_pitch_tol_mm = 0.05

# shift-oee and queue-eta: the minutes of a shift (30 to 1440) and the seconds a person takes to change one reel (0 to 3600).
shift_minutes = 480
reel_change_s = 60

# panel-fids: the least distance (mm) between the two marks of a board that are farthest apart for the board to be aligned by its own marks (0 to 1000).
panel_fid_min_sep_mm = 10

# clearance: the least space (mm) between the bodies of two parts on the same side before the pair is called out (0 to 5).
clearance_min_mm = 0.2

# lot-age: the age (weeks, from the date code of the lot) over which the lot of a reel is called old (1 to 1040).
lot_max_weeks = 104

# export-fab and dfm-check: the files for an assembly house. fab_dnp_mode is column (a part that is not to be mounted stays in the files and a column marks it) or omit; fab_tht_words are the words of a package name that tell a part that goes through the board.
fab_dnp_mode = column
fab_dnp_column = Customer Supply
fab_tht_words = tht, dip, axial, radial, pinheader, pinsocket, through, to-220, to-92, to-247, hole

# convert-cpl: the point of the file that becomes the origin (mm), whether Y goes the other way, whether the rotation is counted clockwise, a turn added to every part (degrees) and what is done last with the rotation of the bottom side (keep, mirror or half_turn).
cpl_origin_x_mm = 0
cpl_origin_y_mm = 0
cpl_flip_y = no
cpl_rotation_cw = no
cpl_rotation_offset_deg = 0
cpl_bottom_rotation = keep

# ipc-name and footprint-find: the density of the land of the names of the convention of IPC-7351B (L, N or M), the most names listed and how many letters a name may differ by to count as near.
ipc_density = N
ipc_search_limit = 20
ipc_search_distance = 2

# dfm-check: the limits of the checks for assembly (mm). They are the public figures of the guides of assembly houses; dfm_verified says whether they have been compared with the rules of the house.
dfm_verified = no
dfm_pad_pitch_mm = 1.27
dfm_pad_gap_min_mm = 0.2
dfm_smt_gap_mm = 1.0
dfm_track_center_frac = 0.25
dfm_tooling_edge_mm = 3
dfm_smt_tooling_edge_mm = 5
dfm_tooling_hole_mm = 2
dfm_hole_tol_mm = 0.1
dfm_fid_diameter_mm = 1
dfm_fid_edge_mm = 3.85
dfm_fid_ring_mm = 2
dfm_rail_min_mm = 4

# stencil-apertures: the thickness of the stencil (mm), the reduction of the openings (per cent) with the range it should be in, the same for a fine pitch, the area ratio, and the windows of a thermal pad.
stencil_thickness_mm = 0.12
stencil_thickness_min_mm = 0.10
stencil_thickness_max_mm = 0.15
stencil_reduction_percent = 6
stencil_reduction_min_percent = 5
stencil_reduction_max_percent = 7
stencil_fine_reduction_percent = 15
stencil_fine_reduction_min_percent = 10
stencil_fine_reduction_max_percent = 20
stencil_fine_pitch_mm = 0.5
stencil_area_ratio_min = 0.66
stencil_thermal_percent = 60
stencil_thermal_min_percent = 50
stencil_thermal_max_percent = 75
stencil_thermal_side_mm = 2
stencil_window_max_mm = 2
stencil_web_mm = 0.3

# sim-tower: the wait (seconds) that turns the tower yellow and how many times the median step a step may take; sim-busy: how many waits are listed.
tower_idle_gap_s = 2
tower_slow_factor = 3

busy_gaps_listed = 5

# align-iterate (look, move, look again): the longest step (mm) after a look, the error (mm) under which the head is aligned, how many moves are made, the share of what is seen that is moved,
# and the constant error of the camera against the nozzle (mm). A look that gets worse halves the step and the share for the rest of the run; they never go up again.
lml_max_step_mm = 0.5
lml_tolerance_mm = 0.02
lml_max_iterations = 4
lml_gain = 0.8
lml_offset_x_mm = 0
lml_offset_y_mm = 0

# vacuum-calibrate: how far inside the gap between the readings with and without a part each threshold is put (per cent of the gap), the gap (kPa) under which it is told as small and the
# fewest readings of a state that are trusted.
vacuum_margin_pct = 25
vacuum_min_gap_kpa = 10
vacuum_min_readings = 5

# test-board-gen: the distance (mm) between two parts of a made-up board and how many parts it has.
testboard_pitch_mm = 2
testboard_count = 40

# slot-bank: how wide one slot of a bank of feeders is (mm), the gap a feeder needs beside its tape (mm), how many slots a bank has and how far from the inner edge of the bank the head can
# pick (mm). A tape of W mm takes the next whole number of slots above (W + gap) / pitch.
slot_pitch_mm = 4
slot_gap_mm = 4
slot_bank_slots = 60
slot_reach_mm = 240

# The nodes of the feeders and of the head: how many questions in a row may go unanswered before the link is told to be silent and the machine is held, and how long one question may take (s).
node_silence_limit = 3
node_timeout_s = 2

# panel-compose: the least distance between the outlines of two boards of a panel (mm).
panel_clearance_mm = 1

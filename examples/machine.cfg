# EH3D-PHOENIX-PNP machine and planner settings. Every line is optional; a missing line keeps the default shown here.
# The format is key = value, one per line, as in the other programs of the suite. A line that starts with # is a comment.

# The version of this file format. A file with a higher number than the program knows is refused.
schema_version = 1
# The language of the error messages: en, es, de, fr, it, ja, zh or pt.
language = en
# The largest file (bytes) and the most parts the program will read.
max_file_bytes = 16777216
max_parts = 50000

# How many parts the head carries at once, from 1 to 6.
nozzles = 2

# Motion of the head. speed_mm_s sets the speed of both axes; the x_ and y_ keys set one axis.
# Acceleration in mm/s2; jerk in mm/s3 (0 = a trapezoid profile without jerk). X and Y move at the same time, so a move takes as long as the slower axis.
speed_mm_s = 150
x_speed_mm_s = 150
y_speed_mm_s = 150
x_accel_mm_s2 = 2000
y_accel_mm_s2 = 2000
x_jerk_mm_s3 = 0
y_jerk_mm_s3 = 0

# Times of the actions, in seconds.
pick_s = 0.4
place_s = 0.4
feed_s = 0.2
tip_change_s = 3

# The nozzle turns this fast (degrees per second) and may turn only within this range of absolute angles.
rotation_deg_s = 720
nozzle_angle_min_deg = -360
nozzle_angle_max_deg = 360
# Turn the nozzle while the head travels (yes) or only when it arrives (no).
pre_rotate = yes

# Heights (Z) and limits. safe_z_mm must be inside the travel of Z and not below the top of the board; the limits of X and Y are checked before a job runs.
safe_z_mm = 5
board_top_z_mm = 0
z_min_mm = -10
z_max_mm = 50
limit_x_min_mm = -2000
limit_x_max_mm = 2000
limit_y_min_mm = -2000
limit_y_max_mm = 2000

# Retries: how many more times to try a feed, a pick or a place that failed. max_placement_attempts is the ceiling on the attempts to place one part.
feed_retries = 1
pick_retries = 2
place_retries = 1
max_placement_attempts = 3
# alert = stop the job at once; defer = put the part aside and go on.
error_policy = alert
# A feeder is switched off when fault_limit of its last fault_window picks failed (fault_limit = 0 never switches it off).
fault_window = 6
fault_limit = 3

# The order of the places: nearest, part, height_part, pick, tips or none.
order = nearest
# minimize = bring the parts of the same nozzle tip together; as_planned = follow the planned order.
tip_strategy = minimize
# Shorten the walk with 2-opt moves (never makes it longer), for walks of up to two_opt_max_points places, with at most two_opt_passes passes.
two_opt = yes
two_opt_max_points = 2000
two_opt_passes = 10
# Two ranks that differ by at least rank_step are a hard order (all of the lower rank first); a smaller difference is only a preference.
rank_step = 10
# cad_origin = the point of a part is the origin of its footprint; pads_center = apply the origin correction of the table of parts.
component_origin = cad_origin

# Defaults for the properties of a part that neither the table of parts nor the table of packages sets.
default_height_mm = 1
default_through_board_mm = 0
default_bin = 0
default_tip =
default_rank = 0

# The place of the nozzle tip changer (both or neither).
tip_changer_x_mm = -50
tip_changer_y_mm = 0

# Correction of the rotation by package: PATTERN : DEGREES, added to the angle of the parts. The first rule that matches wins; * stands for any text and ? for one character.
rotation = QFN-* : 90
rotation = SOT-23* : 180

# More names for the columns of a CSV position file, separated by commas (they are added to the usual ones).
header_reference = designator
header_value = comment
header_package = footprint
header_x = center-x
header_y = center-y
header_rotation = rotation
header_side = layer
# Which pair of position columns to read when a file has both the centre and the origin of the part: any, center or origin.
position = any
# What to do with the angle of the parts of the bottom side in a CSV: keep, mirror (360 minus the angle) or half_turn (plus 180).
bottom_rotation = keep

# The simulator: a seed, so that the same settings always fail in the same places, and the chance (0 to 1) that a feed, a pick or a place fails.
sim_seed = 1
sim_feed_fail_rate = 0
sim_pick_fail_rate = 0
sim_place_fail_rate = 0

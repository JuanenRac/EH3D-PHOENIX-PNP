# EH3D-PHOENIX-PNP machine and planner settings. Every line is optional; a missing line keeps the default shown here.
# The format is key = value, one per line, as in the other programs of the suite. A line that starts with # is a comment.

# The version of this file format. A file with a higher number than the program knows is refused.
schema_version = 1
# The language of the error messages: en, es, de, fr, it, ja, zh or pt.
language = en
# The largest file (bytes) and the most parts the program will read.
max_file_bytes = 16777216
max_parts = 50000

# How many parts the head carries at once, from 1 to 6.
nozzles = 2

# Motion of the head. speed_mm_s sets the speed of both axes; the x_ and y_ keys set one axis.
# Acceleration in mm/s2; jerk in mm/s3 (0 = a trapezoid profile without jerk). X and Y move at the same time, so a move takes as long as the slower axis.
speed_mm_s = 150
x_speed_mm_s = 150
y_speed_mm_s = 150
x_accel_mm_s2 = 2000
y_accel_mm_s2 = 2000
x_jerk_mm_s3 = 0
y_jerk_mm_s3 = 0

# Times of the actions, in seconds.
pick_s = 0.4
place_s = 0.4
feed_s = 0.2
tip_change_s = 3

# The nozzle turns this fast (degrees per second) and may turn only within this range of absolute angles.
rotation_deg_s = 720
nozzle_angle_min_deg = -360
nozzle_angle_max_deg = 360
# Turn the nozzle while the head travels (yes) or only when it arrives (no).
pre_rotate = yes

# Heights (Z) and limits. safe_z_mm must be inside the travel of Z and not below the top of the board; the limits of X and Y are checked before a job runs.
safe_z_mm = 5
board_top_z_mm = 0
z_min_mm = -10
z_max_mm = 50
limit_x_min_mm = -2000
limit_x_max_mm = 2000
limit_y_min_mm = -2000
limit_y_max_mm = 2000

# Retries: how many more times to try a feed, a pick or a place that failed. max_placement_attempts is the ceiling on the attempts to place one part.
feed_retries = 1
pick_retries = 2
place_retries = 1
max_placement_attempts = 3
# alert = stop the job at once; defer = put the part aside and go on.
error_policy = alert
# A feeder is switched off when fault_limit of its last fault_window picks failed (fault_limit = 0 never switches it off).
fault_window = 6
fault_limit = 3
# What happens then: disable = the feeder is switched off and another one of the same kind takes over; alert = the job stops with PHOENIX-PNP-047 and the person chooses (try again, leave the part out, put it aside or switch the feeder off).
fault_action = disable

# The order of the places: nearest, part, height_part, pick, tips or none.
order = nearest
# minimize = bring the parts of the same nozzle tip together; as_planned = follow the planned order; optimize = bring them together and search for the order of the tips with the
# shortest way and time (the trip to the tip changer included, and the tip already on the nozzle when a block of ranks starts).
tip_strategy = minimize
# Shorten the walk with 2-opt moves (never makes it longer), for walks of up to two_opt_max_points places, with at most two_opt_passes passes.
two_opt = yes
two_opt_max_points = 2000
two_opt_passes = 10
# Ranks are grouped in blocks of rank_step (0 to 9, 10 to 19, ...). All the parts of a lower block are placed before any part of a higher block; inside a block a lower rank is only a preference.
rank_step = 10
# cad_origin = the point of a part is the origin of its footprint; pads_center = apply the origin correction of the table of parts.
component_origin = cad_origin

# Defaults for the properties of a part that neither the table of parts nor the table of packages sets.
default_height_mm = 1
default_through_board_mm = 0
default_bin = 0
default_tip =
default_rank = 0
# The width of the tape, in millimetres, of a part that no table gives it for.
default_tape_mm = 8

# The place of the nozzle tip changer (both or neither).
tip_changer_x_mm = -50
tip_changer_y_mm = 0

# Correction of the rotation by package: PATTERN : DEGREES, added to the angle of the parts. The first rule that matches wins; * stands for any text and ? for one character.
rotation = QFN-* : 90
rotation = SOT-23* : 180

# More names for the columns of a CSV position file, separated by commas (they are added to the usual ones).
header_reference = designator
header_value = comment
header_package = footprint
header_x = center-x
header_y = center-y
header_rotation = rotation
header_side = layer
# More names for the column that says a part is not to be mounted (a yes in it leaves the part out of the plan; the usual ones are dnp, do not place, do not populate, do not mount,
# do_not_place, not fitted and no montar) and for the column that says a part is to be mounted (a no leaves it out; fitted, populate, populated, mount, mounted and montar). An empty cell mounts the part.
header_dnp = exclude
header_fitted = assemble
# More words that mean yes and no in those columns (yes, y, true, 1 and x mean yes; no, n, false, 0 and - mean no). Any other word is an error that names the row.
dnp_yes_words = si, ja
dnp_no_words = nao, nein
# Which pair of position columns to read when a file has both the centre and the origin of the part: any, center or origin.
position = any
# What to do with the angle of the parts of the bottom side in a CSV: keep, mirror (360 minus the angle) or half_turn (plus 180).
bottom_rotation = keep

# The simulator: a seed, so that the same settings always fail in the same places, and the chance (0 to 1) that a feed, a pick or a place fails.
sim_seed = 1
sim_feed_fail_rate = 0
sim_pick_fail_rate = 0
sim_place_fail_rate = 0
# Chances of failure by kind of part and by feeder, on top of the general ones (written more than once, one line for each): the package (with * and ?) and the chance that a pick and a
# place of it fail, and the id of a feeder and the chance that a pick from it fails. The first rule for a package is the one used. They are listed in the statistics of a simulation.
sim_part_fail = QFN-* : 0 : 0
sim_feeder_fail = F3 : 0

# The window (the program started without a command): how many steps of the simulated job it makes in a second (0.1 to 1000), the colours (phoenix, light or contrast)
# and the side, in millimetres, of the square drawn for a part whose package it does not know (0.2 to 50).
gui_steps_per_s = 4
gui_theme = phoenix
gui_part_size_mm = 2

# Fiducials of a panel (the command line option --fiducials, and the Panels tab of the window): the measured places of the marks are fitted to the designed ones. auto = a similarity
# (a turn, one scale, a shift) with two marks and an affine fit with three or more; similarity or affine force one. A mark further than fiducial_max_residual_mm (millimetres)
# from where the fit puts it makes the fit refused.
fiducial_mode = auto
fiducial_max_residual_mm = 0.5

# Parts that are marks and not parts to mount: a part whose value or package holds one of the words of fiducial_words (a list separated by commas, any case) or whose reference is
# one of the prefixes of fiducial_refs followed by a number (FID1, FD2) is not placed: it becomes a mark of its board, named board/reference (A/FID1), that a measured mark can name
# in the file of --fiducials. An empty list turns that rule off.
fiducial_words = fiducial
fiducial_refs = fid, fd

# The order in which the cells of a tray are emptied when its row of the feeders file has no fill column: rows, columns or snake (along a row and back along the next).
tray_fill = rows

# The window: how many edits of the tables of feeders and packages (and fixes of the problems) can be taken back, from 1 to 1000.
undo_limit = 100

# The search of tip_strategy = optimize stops after tip_opt_max_evals orders of the tips have been tried or after tip_opt_time_limit_s seconds of the clock, whichever comes first.
# Only the number of orders tried gives the same plan on every computer; up to eight different tips are tried in every order, more are ordered by the nearest first.
tip_opt_max_evals = 20000
tip_opt_time_limit_s = 1

# The align step: after a part is picked the camera looks at it and the place is corrected by what it sees (off = the job is exactly the one without the step; on = look and correct).
align = off
# A part that the camera finds further than this (millimetres, 0.001 to 50) from the nozzle is thrown away and picked again, as error_policy says.
pick_tolerance_mm = 0.5
# How many times the camera looks and the correction is made again (1 to 5), and the seconds (0 to 10) to wait before every look for the part to settle on the nozzle. Both add to the time of the plan.
align_passes = 1
align_settle_s = 0.1
# The simulated camera: the chance (0 to 1) that a look gives no reading, how far (millimetres) and how much turned (degrees) it finds every part, and a random error of each reading
# (from minus to plus this many millimetres, drawn from sim_seed).
sim_camera_fail_rate = 0
sim_align_dx_mm = 0
sim_align_dy_mm = 0
sim_align_deg = 0
sim_align_noise_mm = 0
# Where the simulated camera takes its readings from: off = the offset above; pipeline = it draws a picture of the part (an image made in memory) and the vision pipeline measures it
# (the steps of the pipeline are in vision.cfg, given with --vision FILE). Only the align step looks at the camera.
vision = off

# The vacuum (off = the job is exactly the one without it; on = after a pick the vacuum must show the part on the nozzle, after a place it must show it gone). The seconds (0 to 10) the pump sucks before
# the first reading and the seconds of blowing before the second one add to the time of the plan.
vacuum = off
vacuum_suck_s = 0.08
vacuum_blow_s = 0.05
# The levels, in kilopascals below the air (0 to 101), must satisfy free <= release_max < pick_min <= held. The simulated nozzle reads free_kpa when it holds nothing and held_kpa when it holds a part;
# a reading at or above pick_min_kpa after a pick means the part is held, a reading at or below release_max_kpa after a place means the part is gone.
vacuum_free_kpa = 8
vacuum_held_kpa = 62
vacuum_pick_min_kpa = 40
vacuum_release_max_kpa = 20
# The simulated sensor: a random error of each reading (from minus to plus this many kilopascals, drawn from sim_seed) and the chances (0 to 1) that a pick leaves no part on the nozzle (PHOENIX-PNP-044)
# and that a place leaves the part stuck to it (PHOENIX-PNP-045).
sim_vacuum_noise_kpa = 0
sim_vacuum_miss_rate = 0
sim_vacuum_stuck_rate = 0
# The on/off devices of the machine (a valve, a light, a pump), one line each: a name of letters, digits, _ and - and the seconds (0 to 10) the device takes to answer. The simulated job switches them with
# Job::set_actuator, which adds that time to the clock of the machine.
actuator = light : 0.02
